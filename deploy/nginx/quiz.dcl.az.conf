# quiz.dcl.az  ->  paxlava-quiz konteyneri (daxili port 5000)
#
# Faylı nginx-proxy-nin conf qovluğuna qoyun:  /root/nginx/conf.d/quiz.dcl.az.conf
# Yeniləmə:  docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
#
# Şərtlər:
#  - paxlava-quiz və nginx-proxy eyni şəbəkədə (proxy-network)
#  - quiz.dcl.az üçün SSL sertifikatı alınmış olmalıdır (bax: DEPLOY.md)

server {
    listen 80;
    server_name quiz.dcl.az;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://quiz.dcl.az$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name quiz.dcl.az;

    ssl_certificate     /etc/letsencrypt/live/quiz.dcl.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.dcl.az/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://paxlava-quiz:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
